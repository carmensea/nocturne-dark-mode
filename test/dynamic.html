<!doctype html>
<html><head><meta charset="utf-8"><title>Dynamic + shadow</title>
<style>body{background:#fff;color:#222;font:15px/1.5 system-ui;margin:0;padding:20px}
.box{background:#f5f5f5;border:1px solid #ddd;padding:12px;margin:10px 0}</style>
</head>
<body>
<h1>Dynamic content</h1>
<div class="box" id="static">Static box present at parse time.</div>
<div id="later"></div>
<my-widget></my-widget>
<iframe id="frame" src="frame.html" width="400" height="90" style="border:1px solid #ccc"></iframe>
<div id="bulk"></div>
<script>
  // Shadow DOM with its own stylesheet.
  class MyWidget extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `<style>
        .panel { background:#ffffff; color:#111111; border:1px solid #dddddd; padding:12px; margin:10px 0; }
        a { color:#1a0dab; }
      </style>
      <div class="panel">Shadow DOM panel with <a href="#">a shadow link</a>.
        <span style="background:#ffffff;color:#000;padding:3px">inline in shadow</span></div>`;
    }
  }
  customElements.define('my-widget', MyWidget);

  // Content injected after load, the way an SPA route change would.
  setTimeout(() => {
    document.getElementById('later').innerHTML =
      '<div class="box">Injected after 1200ms.</div>' +
      '<div style="background:#ffffff;color:#000;padding:10px;border:1px solid #e0e0e0">Injected inline-styled box</div>';
    // A stylesheet injected late, the way CSS-in-JS does it.
    const s = document.createElement('style');
    s.textContent = '.late { background:#fafafa; color:#333; border:1px solid #e5e5e5; padding:10px; }';
    document.head.appendChild(s);
    document.getElementById('later').insertAdjacentHTML('beforeend', '<div class="late">Late stylesheet rule</div>');
  }, 1200);

  // Bulk nodes to exercise the element budget.
  const bulk = document.getElementById('bulk');
  let html = '';
  for (let i = 0; i < 3000; i++) {
    html += '<span style="background:#ffffff;color:#333333;border:1px solid #ddd">' + i + '</span> ';
  }
  bulk.innerHTML = html;
</script>
</body></html>
