<!doctype html><html class="dark"><head><meta charset="utf-8">
<style>body{background:#0e0e10;color:#efeff1;margin:0;font:16px system-ui}
.player{position:relative;width:640px;height:360px;margin:40px;background:#000}
.video{position:absolute;inset:0;background:linear-gradient(135deg,#e53935,#fdd835)}
iframe.overlay{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}</style>
</head><body>
<h1>Overlay iframe over media</h1><p>The red/yellow box must stay visible: the transparent iframe on top (like a Twitch extension) must not get a dark body.</p>
<div class="player"><div class="video"></div><iframe class="overlay" src="overlay-frame.html"></iframe></div>
</body></html>
